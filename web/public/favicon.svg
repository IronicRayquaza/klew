<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Architectural Dark Slate Tile -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#18303f" stroke="#2b485a" stroke-width="1"/>

  <!-- Unvisited 3x3 Labyrinth / Code-Graph Matrix Nodes -->
  <g fill="#8fa3ae" opacity="0.42">
    <circle cx="16" cy="7.5" r="1.2"/>
    <circle cx="16" cy="16" r="1.2"/>
    <circle cx="23.5" cy="16" r="1.2"/>
    <circle cx="16" cy="24.5" r="1.2"/>
  </g>

  <!-- Exploratory Dotted Thread (unwinding from the Clew at (8.5, 7.5) down to (8.5, 16)) -->
  <circle cx="8.5" cy="11.5" r="0.8" fill="#e0a23b" opacity="0.72"/>
  <circle cx="8.5" cy="13.4" r="0.85" fill="#e0a23b" opacity="0.95"/>

  <!-- Solid Reinforced Desire-Path Thread (forming the letter K on the 3x3 grid) -->
  <path d="M 8.5 16 L 8.5 24.5" stroke="#e0a23b" stroke-width="2.15" stroke-linecap="round"/>
  <path d="M 23.5 7.5 L 8.5 16 L 23.5 24.5" stroke="#e0a23b" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-Left Origin: Ariadne's Clew (concentric coiled ball of thread) -->
  <circle cx="8.5" cy="7.5" r="2.25" fill="#18303f" stroke="#e0a23b" stroke-width="1.25"/>
  <circle cx="8.5" cy="7.5" r="0.95" fill="#e0a23b"/>

  <!-- Graph Traversal Nodes along the 3x3 K coordinates -->
  <circle cx="8.5" cy="16" r="1.85" fill="#18303f" stroke="#e0a23b" stroke-width="1.5"/>
  <circle cx="8.5" cy="24.5" r="1.85" fill="#e0a23b"/>
  <circle cx="23.5" cy="7.5" r="1.85" fill="#e0a23b"/>

  <!-- Reinforced Target File Node (Moss) -->
  <circle cx="23.5" cy="24.5" r="2.35" fill="#6fc29a"/>
</svg>
