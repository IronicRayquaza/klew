[project]
name = "klew"
version = "0.1.0"
description = "Self-improving code context for coding agents: an MCP server that walks a code graph in HydraDB and learns from every merged PR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Klew contributors" }]
keywords = ["mcp", "model-context-protocol", "coding-agents", "code-graph", "context", "hydradb", "claude", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "neo4j>=5.20",
  "pydantic>=2.7",
  "typer>=0.12",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tiktoken>=0.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "mcp>=2.3",
  "numpy>=1.26",
  "structlog>=24.1",
]

[project.optional-dependencies]
vector = ["fastembed>=0.3"]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
klew = "klew.cli:app"

[project.urls]
Homepage = "https://github.com/IronicRayquaza/klew"
Repository = "https://github.com/IronicRayquaza/klew"
Documentation = "https://github.com/IronicRayquaza/klew#readme"
Issues = "https://github.com/IronicRayquaza/klew/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klew"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hydra: needs a live HydraDB node (KLEW_TEST_HYDRA=1)"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E731"]  # B008: Typer's Argument/Option defaults are the documented pattern

[tool.hatch.build.targets.sdist]
include = ["/klew", "/README.md", "/LICENSE", "/pyproject.toml"]
