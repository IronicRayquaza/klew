[project]
name = "desirepath"
version = "0.1.0"
description = "A self-improving code-context layer for coding agents, built on HydraDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "neo4j>=5.20",
  "pydantic>=2.7",
  "typer>=0.12",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tiktoken>=0.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "mcp>=2.3",
  "numpy>=1.26",
  "structlog>=24.1",
]

[project.optional-dependencies]
vector = ["fastembed>=0.3"]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
desirepath = "desirepath.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desirepath"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hydra: needs a live HydraDB node (DP_TEST_HYDRA=1)"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E731"]  # B008: Typer's Argument/Option defaults are the documented pattern
